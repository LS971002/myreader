name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project MyReader.xcodeproj \
            -scheme MyReader \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/MyReader.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/MyReader.xcarchive/Products/Applications/MyReader.app build/Payload/
          cd build
          zip -qry MyReader-unsigned.ipa Payload
          ls -lh MyReader-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyReader-unsigned-ipa
          path: build/MyReader-unsigned.ipa
          if-no-files-found: error
